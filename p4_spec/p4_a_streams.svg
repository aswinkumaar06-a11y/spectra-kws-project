<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 536" width="100%"><rect x="0" y="0" width="1200" height="536" fill="white"/><defs><marker id="aN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B1F3A"/></marker><marker id="aO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF6B1A"/></marker><marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E8A"/></marker><marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E6B7D"/></marker><marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="aGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7C3E"/></marker><marker id="aS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7490"/></marker></defs><text x="30" y="36" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0B1F3A" text-anchor="start">P4 · Confidence Trigger &amp; LED Timing — State Machine &amp; Test Streams A–D</text><rect x="50" y="68" width="220" height="76" rx="12" fill="#163866"/><text x="160.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LISTEN</text><text x="160.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle">Dark · p ≤ 0.5</text><line x1="274" y1="106.0" x2="336" y2="106.0" stroke="#FF6B1A" stroke-width="3" marker-end="url(#aO)"/><text x="305.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#1A1A1A" text-anchor="middle">p &gt; 0.5 (count=1)</text><rect x="340" y="68" width="220" height="76" rx="12" fill="#0E7490"/><text x="450.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CANDIDATE</text><text x="450.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle">Dark · Count 1..2</text><line x1="564" y1="106.0" x2="626" y2="106.0" stroke="#FF6B1A" stroke-width="3" marker-end="url(#aO)"/><text x="595.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#1A1A1A" text-anchor="middle">p &gt; 0.5 (count=3)</text><rect x="630" y="68" width="220" height="76" rx="12" fill="#0E7C3E"/><text x="740.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">TRIGGERED</text><text x="740.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle">FIRE! · LED ON</text><line x1="854" y1="106.0" x2="916" y2="106.0" stroke="#FF6B1A" stroke-width="3" marker-end="url(#aO)"/><text x="885.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#1A1A1A" text-anchor="middle">tick fire actions</text><rect x="920" y="68" width="220" height="76" rx="12" fill="#B45309"/><text x="1030.0" y="100.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">COOLDOWN</text><text x="1030.0" y="120.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle">LED ON · 4 ticks (2s)</text><line x1="1030.0" y1="144" x2="160.0" y2="144" stroke="#009E8A" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#aT)"/><text x="600" y="164" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#009E8A" text-anchor="middle">ticks_left == 0 (LED OFF → Return to LISTEN fresh)</text><rect x="14" y="200" width="1172" height="180" rx="12" fill="#EAF0F7" stroke="#C9D3E3" stroke-width="2"/><text x="34" y="226" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0B1F3A" text-anchor="start">NORMATIVE TEST STREAMS (Discrete 500 ms Hops, P_THRESH = 0.50):</text><text x="34" y="254" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#1A1A1A" text-anchor="start">Stream A (Clean):</text><text x="200" y="254" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#0E7490" text-anchor="start">[.10, .20, .60, .70, .80, .30, .10]</text><text x="620" y="254" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0E7C3E" text-anchor="start">Fire @ Tick 4</text><text x="760" y="254" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="start">LED ON@4, Cooldown covers ticks 5-6</text><text x="34" y="284" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#1A1A1A" text-anchor="start">Stream B (Flicker):</text><text x="200" y="284" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#0E7490" text-anchor="start">[.60, .40, .70, .40, .80, .90, .95]</text><text x="620" y="284" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0E7C3E" text-anchor="start">Fire @ Tick 6</text><text x="760" y="284" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="start">Expire drops below 0.5 twice, resets count to 0</text><text x="34" y="314" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#1A1A1A" text-anchor="start">Stream C (Cooldown):</text><text x="200" y="314" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#0E7490" text-anchor="start">[.90, .90, .90, .90, .90, .90, .90, .10]</text><text x="620" y="314" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0E7C3E" text-anchor="start">Fire @ Tick 2</text><text x="760" y="314" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="start">Ticks 3–6 suppressed during 4-tick cooldown despite p=0.9</text><text x="34" y="344" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#1A1A1A" text-anchor="start">Stream D (Double):</text><text x="200" y="344" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#0E7490" text-anchor="start">[.85, .90, .95, .10, .10, .10, .10, .80, .85, .90]</text><text x="620" y="344" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#0E7C3E" text-anchor="start">Fire @ Ticks [2, 9]</text><text x="760" y="344" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#1A1A1A" text-anchor="start">LED ON@2, OFF@7, ON@9; re-fire after fresh LISTEN</text><rect x="14" y="396" width="1172" height="126" rx="12" fill="#EAF0F7" stroke="#C9D3E3" stroke-width="2"/><text x="34" y="422" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0B1F3A" text-anchor="start">FIRE ACTIONS &amp; NORMATIVE PROTOCOL (Binding Rules):</text><text x="34" y="446" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start">1. LED Control: ON at fire tick (GPIO 27 active HIGH), persists through cooldown end, OFF otherwise</text><text x="34" y="468" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start">2. Normative UART Format: TRIG tick=%u t_ms=%lu p=[%.3f,%.3f,%.3f] pre_ts=%lu (exact float format)</text><text x="34" y="490" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start">3. NVS Persistence: trigger_count++ &amp; last_trigger_ts stored in "spectra" namespace (honesty: raw triggers, no FA claim)</text><text x="34" y="510" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#0E7C3E" text-anchor="start">4. Pre-Roll Snapshot: 16,000 INT16 samples (32 KB in internal SRAM) copied without stalling live capture</text></svg>