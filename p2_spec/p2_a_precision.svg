6"/><text x="228.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">GATE+NORM</text><text x="228.0" y="115.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">≥0.03 · ÷peak</text><line x1="145" y1="100.0" x2="161" y2="100.0" stroke="#FF6B1A" stroke-width="3" marker-end="url(#aO)"/><rect x="314" y="62" width="128" height="76" rx="12" fill="#0E7490"/><text x="378.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">HANN+FFT</text><text x="378.0" y="115.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">int16 · /2 ×10</text><line x1="295" y1="100.0" x2="311" y2="100.0" stroke="#FF6B1A" stroke-width="3" marker-end="url(#aO)"/><rect x="464" y="62" width="128" height="76" rx="12" fill="#0E7490"/><text x="528.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">POWER</text><text x="528.0" y="115.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">int64 · re²+im²</text><line x1="445" y1="100.0" x2="461" y2="100.0" stroke="#FF6B1A" stroke-width="3" marker-end="url(#aO)"/><rect x="614" y="62" width="128" height="76" rx="12" fill="#009E8A"/><text x="678.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SPARSE MEL</text><text x="678.0" y="115.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">f32 · 128</text><line x1="595" y1="100.0" x2="611" y2="100.0" stroke="#FF6B1A" stroke-width="3" marker-end="url(#aO)"/><rect x="764" y="62" width="128" height="76" rx="12" fill="#009E8A"/><text x="828.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LOG+CLIP</text><text x="828.0" y="115.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">+60.21 · top80</text><line x1="745" y1="100.0" x2="761" y2="100.0" stroke="#FF6B1A" stroke-width="3" marker-end="url(#aO)"/><rect x="914" y="62" width="128" height="76" rx="12" fill="#009E8A"/><text x="978.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DCT 40</text><text x="978.0" y="115.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">f32 ortho</text><line x1="895" y1="100.0" x2="911" y2="100.0" stroke="#FF6B1A" stroke-width="3" marker-end="url(#aO)"/><rect x="1064" y="62" width="128" height="76" rx="12" fill="#0E7C3E"/><text x="1128.0" y="94.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">QUANT</text><text x="1128.0" y="115.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" fill="#FFFFFF" text-anchor="middle">banker · int8</text><line x1="1045" y1="100.0" x2="1061" y2="100.0" stroke="#FF6B1A" stroke-width="3" marker-end="url(#aO)"/><text x="600" y="168" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0B1F3A" text-anchor="middle">golden exports from Python (never recomputed in C):</text><rect x="90" y="180" width="240" height="40" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="210" y="206" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#B45309" text-anchor="middle">★ Hann-1024 Q15</text><rect x="360" y="180" width="240" height="40" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="480" y="206" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#B45309" text-anchor="middle">★ twiddle-512 Q15</text><rect x="630" y="180" width="240" height="40" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="750" y="206" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#B45309" text-anchor="middle">★ mel 128×513 f32</text><rect x="900" y="180" width="240" height="40" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="2"/><text x="1020" y="206" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#B45309" text-anchor="middle">★ DCT 40×128 f32</text><rect x="14" y="244" width="1172" height="150" rx="12" fill="#EAF0F7" stroke="#C9D3E3" stroke-width="2"/><text x="34" y="272" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0B1F3A" text-anchor="start">SCALE DERIVATION (exact):</text><text x="34" y="298" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A" text-anchor="start">· FFT /2 per stage × 10 stages = ÷1024 → power ÷1024² → log-mel shifted −60.206 dB uniformly</text><text x="34" y="322" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A" text-anchor="start">· compensation: logmel += +60.206 dB BEFORE top_db clip → c0 exact; c1..c39 untouched by construction</text><text x="34" y="346" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A" text-anchor="start">· power in int64: 2×32767² = 2.147e9 overflows int32 — documented trap, not a guess</text><text x="34" y="370" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A" text-anchor="start">· power spectrum |X|² (librosa power=2.0) · unnormalized FFT (no 1/N) · reflect-pad 512/side</text><rect x="14" y="408" width="1172" height="96" rx="12" fill="#EAF0F7" stroke="#C9D3E3" stroke-width="2"/><text x="34" y="436" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0E7C3E" text-anchor="start">PARITY GATE (blocking): 50 golden clips over UART — max|Δ| ≤ 1e-3 · int8 bytes ≥ 99% · argmax gate moves to P3</text><text x="34" y="462" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A" text-anchor="start">cycle budget: measured &lt; 100 ms @240 MHz (soft) · memory: FFT scratch ≈8 KB internal · tables ≈290 KB flash</text><text x="34" y="486" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A" text-anchor="start">goldens record librosa/scipy/numpy versions — regenerate (never hand-edit) on env change</text></svg>