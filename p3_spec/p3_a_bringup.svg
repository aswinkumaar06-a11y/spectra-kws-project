<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 536" width="100%"><rect x="0" y="0" width="1200" height="536" fill="white"/><defs><marker id="aN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0B1F3A"/></marker><marker id="aO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF6B1A"/></marker><marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#009E8A"/></marker><marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E6B7D"/></marker><marker id="aR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B91C1C"/></marker><marker id="aGr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7C3E"/></marker><marker id="aS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7490"/></marker></defs><text x="30" y="36" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#0B1F3A" text-anchor="start">P3 · TFLM Inference Pipeline — Minimal Resolver &lt;5&gt;, Internal SRAM &amp; Logits Parity</text><rect x="14" y="66" width="146" height="76" rx="12" fill="#163866"/><text x="87.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MODEL FLASH</text><text x="87.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle">39,552 B · TFL3</text><rect x="182" y="66" width="146" height="76" rx="12" fill="#0E7490"/><text x="255.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">RESOLVER &lt;5&gt;</text><text x="255.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle">5 unique opcodes</text><line x1="163" y1="104.0" x2="179" y2="104.0" stroke="#FF6B1A" stroke-width="3" marker-end="url(#aO)"/><rect x="350" y="66" width="146" height="76" rx="12" fill="#0E7490"/><text x="423.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ARENA .BSS</text><text x="423.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle">80 KB · 16B align</text><line x1="331" y1="104.0" x2="347" y2="104.0" stroke="#FF6B1A" stroke-width="3" marker-end="url(#aO)"/><rect x="518" y="66" width="146" height="76" rx="12" fill="#009E8A"/><text x="591.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">FEED INPUT</text><text x="591.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle">int8 [1,40,32,1]</text><line x1="499" y1="104.0" x2="515" y2="104.0" stroke="#FF6B1A" stroke-width="3" marker-end="url(#aO)"/><rect x="686" y="66" width="146" height="76" rx="12" fill="#009E8A"/><text x="759.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">INVOKE TFLM</text><text x="759.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle">Cycle Counted</text><line x1="667" y1="104.0" x2="683" y2="104.0" stroke="#FF6B1A" stroke-width="3" marker-end="url(#aO)"/><rect x="854" y="66" width="146" height="76" rx="12" fill="#009E8A"/><text x="927.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">DEQUANT</text><text x="927.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle">int8 → [p0, p1]</text><line x1="835" y1="104.0" x2="851" y2="104.0" stroke="#FF6B1A" stroke-width="3" marker-end="url(#aO)"/><rect x="1022" y="66" width="146" height="76" rx="12" fill="#0E7C3E"/><text x="1095.0" y="98.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PARITY GATE</text><text x="1095.0" y="118.0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10.5" fill="#FFFFFF" text-anchor="middle">Δ ≤ 0.02 · 100%</text><line x1="1003" y1="104.0" x2="1019" y2="104.0" stroke="#FF6B1A" stroke-width="3" marker-end="url(#aO)"/><text x="600" y="172" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0B1F3A" text-anchor="middle">Verified 5 Opcodes in spectra_model.tflite (10 layers total):</text><rect x="14" y="186" width="224" height="38" rx="8" fill="#FFFFFF" stroke="#009E8A" stroke-width="2"/><text x="126" y="210" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#009E8A" text-anchor="middle">CONV_2D (4x)</text><rect x="250" y="186" width="224" height="38" rx="8" fill="#FFFFFF" stroke="#009E8A" stroke-width="2"/><text x="362" y="210" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#009E8A" text-anchor="middle">DEPTHWISE_CONV_2D (3x)</text><rect x="486" y="186" width="224" height="38" rx="8" fill="#FFFFFF" stroke="#009E8A" stroke-width="2"/><text x="598" y="210" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#009E8A" text-anchor="middle">MEAN (1x)</text><rect x="722" y="186" width="224" height="38" rx="8" fill="#FFFFFF" stroke="#009E8A" stroke-width="2"/><text x="834" y="210" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#009E8A" text-anchor="middle">FULLY_CONNECTED (1x)</text><rect x="958" y="186" width="224" height="38" rx="8" fill="#FFFFFF" stroke="#009E8A" stroke-width="2"/><text x="1070" y="210" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#009E8A" text-anchor="middle">SOFTMAX (1x)</text><rect x="14" y="244" width="1172" height="126" rx="12" fill="#EAF0F7" stroke="#C9D3E3" stroke-width="2"/><text x="34" y="270" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0B1F3A" text-anchor="start">STRICT MEMORY DISCIPLINE (ESP32-C5 Internal SRAM &lt; 256 KB):</text><text x="34" y="294" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start">• Tensor Arena (80 KB): Statically placed in internal SRAM .bss (__attribute__((aligned(16), section(".bss"))))</text><text x="34" y="316" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#B91C1C" text-anchor="start">• NEVER PSRAM: Inference tensors in PSRAM cause severe DMA stall &amp; CPU cache thrashing on micro-controllers</text><text x="34" y="338" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#0E7C3E" text-anchor="start">• Internal SRAM Budget: Arena (80 KB) + MFCC scratch (~87 KB) + Tasks &amp; Stacks (~16 KB) = ~183 KB (&lt; 256 KB target)</text><text x="34" y="358" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start">• Recording Allocator: Evaluates used_bytes on first invoke; finalizes arena headroom to used + 10% + 2 KB guard</text><rect x="14" y="384" width="1172" height="134" rx="12" fill="#EAF0F7" stroke="#C9D3E3" stroke-width="2"/><text x="34" y="410" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0B1F3A" text-anchor="start">MATHEMATICAL CONTRACT &amp; PARITY CRITERIA:</text><text x="34" y="434" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start">• Input Dequant:   q_in = clamp(round(feature / 3.9962144) + 60, -128, 127) contiguous NHWC format</text><text x="34" y="456" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start">• Output Dequant:  p_neg = (q0 + 128) / 256.0f,  p_pos = (q1 + 128) / 256.0f  (scale = 1/256, zp = -128)</text><text x="34" y="478" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#1A1A1A" text-anchor="start">• Zeros Smoke Anchor: Input zeros → q = [127, -128] → p_neg = 0.996094 (±0.01), p_pos = 0.000000 (&lt; 0.01)</text><text x="34" y="500" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#0E7C3E" text-anchor="start">• 5-Clip Boot Self-Test: Minimal vs Reference bit-identical (Δ = 0.0000) on 2 pos, 1 neg, 2 hard neg clips</text></svg>