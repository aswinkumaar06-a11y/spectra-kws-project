-size="12.5" fill="#1A1A1A" text-anchor="start">· 0 FAs in 1 h ⇒ rate &lt; ~3/h (WEAK — cannot honestly claim &lt;1/h) · 0 FAs in 10 h ⇒ rate &lt; ~0.3/h (CLAIM &lt;1/h with margin)</text><text x="50" y="376" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12.5" fill="#1A1A1A" text-anchor="start">· every trigger on keyword-free audio = FA · recall: 20 owner-voice reps at 1 m / 3 m (small-n, labeled honestly)</text><text x="50" y="402" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0E7C3E" text-anchor="start">· VAD TH from measured noise floor (p99 × 4, ≥ 0.01) · failure matrix: Wi-Fi drop / server down / mic unplug / heap-low — each with expected behavior</text><rect x="30" y="438" width="1140" height="62" rx="12" fill="#0E7C3E"/><text x="600" y="464" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">P6 EXIT = everything MEASURED/PASS: heap table · MFCC+invoke ms · 50-UART parity · 5-clip boot · LED visual · NVS retention</text><text x="600" y="488" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">P6 closes S3, T1-measurements, T3-measurements and the P4/P5 device halves — the show-me phase</text></svg>