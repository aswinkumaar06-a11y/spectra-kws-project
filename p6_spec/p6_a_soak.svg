ns-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">FA analyzer</text><rect x="330" y="60" width="180" height="120" rx="12" fill="#0E7490"/><text x="420" y="98" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">SPEAKER</text><text x="420" y="122" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">TV / radio / pods</text><text x="420" y="144" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">no keyword in</text><rect x="560" y="60" width="280" height="120" rx="12" fill="#009E8A"/><text x="700" y="92" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">XIAO C5 + INMP441</text><text x="700" y="114" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">full pipeline + Wi-Fi</text><text x="700" y="136" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">hourly heap · temp</text><text x="700" y="158" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">RSSI · reconnects</text><rect x="890" y="60" width="280" height="120" rx="12" fill="#0E7C3E"/><text x="1030" y="98" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ASR SERVER</text><text x="1030" y="122" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">partials / finals</text><text x="1030" y="144" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" fill="#FFFFFF" text-anchor="middle">UTT success %</text><line x1="280" y1="120" x2="330" y2="120" stroke="#163866" stroke-width="3" marker-end="url(#aN)"/><text x="305" y="108" font-family="Segoe UI, Arial, Helvetica, sans-serif" 